{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Confirmar Eliminación</h3>
                </div>
                <div class="card-body text-center">
                    <h4>¿Estás seguro de que deseas eliminar "{{ product.name }}"?</h4>
                    <p class="text-muted">Esta acción no se puede deshacer.</p>
                    {% if product.image %}
                        <img src="{{ product.image.url }}" class="img-fluid rounded mb-3" style="max-height: 200px; object-fit: cover;" alt="{{ product.name }}">
                    {% endif %}
                    <div class="d-flex gap-3 justify-content-center">
                        <form method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                        </form>
                        <a href="{% url 'catalogo:product_list' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
